[package]
name = "sensor-transformer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
thiserror = "2"
jsonschema = "0.47"
url = "2"
base64 = "0.22"

[dev-dependencies]
httpmock = "0.8"
tower = "0.5"