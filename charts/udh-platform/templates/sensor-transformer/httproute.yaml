{{- if .Values.sensorIngestion.sensorTransformer.ingress.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "data-hub.name" (dict "context" . "name" "sensor-transformer") }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ "sensor-transformer" }}
spec:
  hostnames:
  - {{ include "sensor-ingestion.api.hostname" . }}
  parentRefs:
  - name: {{ include "data-hub.name" (dict "context" . "name" "api") }}
    sectionName: https
  rules:
  - backendRefs:
    - name: {{ include "data-hub.name" (dict "context" . "name" "sensor-transformer") }}
      port: 8088
    matches:
    - path:
        type: PathPrefix
        value: /transform
{{- end -}}
