---
{{- $name := "mdb-frontend" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/part-of: metadata-db
data:
  config.js: | 
    window._env_ = {
        OIDC_AUTHORITY: {{ .Values.global.auth.issuer | quote }},
        OIDC_CLIENT: "mdb-frontend",
        GRAPHQL_WS_ENDPOINT: "wss://{{ printf "%s.%s" $name .Values.global.baseDomain }}/graphql",
        GRAPHQL_HTTP_ENDPOINT: "//{{ printf "%s.%s" $name .Values.global.baseDomain }}/graphql",
        KEYCLOAK_URL: {{ printf "//login.%s/admin/udh/console" .Values.global.baseDomain | quote }},
        GRAFANA_URL: {{ printf "//dashboard.%s" .Values.global.baseDomain | quote }},
        JUPYTERHUB_URL: {{ printf "//jupyterhub.%s" .Values.global.baseDomain | quote }},
        MDB_GRAPHIQL_URL: {{ printf "//mdb.%s" .Values.global.baseDomain | quote }},
        SENTRY_DSN: {{ .Values.sensorIngestion.metadataDB.frontend.sentry.dsn | quote }},
        API_BASE_URL: {{ printf "https://api.%s/api/v1/sensordata" .Values.global.baseDomain | quote }},
        STORAGE_URL: {{ printf "https://storage.%s" .Values.global.baseDomain | quote }},
        DOCS_URL: "https://{{ include "data-hub.docs.hostname" . }}",
        RESOURCE_API_GRAPHQL_ENDPOINT: {{ printf "//login.%s/realms/udh/data-hub/graphql" .Values.global.baseDomain | quote }},
    };
  config.toml: | 
    [advanced]

    [[advanced.headers]]
    source = "/config.js"
    headers = { Cache-Control = "no-store" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/part-of: metadata-db
spec:
  replicas: {{ .Values.sensorIngestion.metadataDB.frontend.replicas | default 1 | int }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
      app.kubernetes.io/part-of: metadata-db
  template:
    metadata:
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/part-of: metadata-db
    spec:
      {{- include "common.images.pullSecrets" (dict "images" (list .Values.sensorIngestion.metadataDB.frontend.image) "global" .Values.global) | nindent 6 }}
      containers:
      - name: frontend
        image: {{ include "udh-platform.images.image" (dict "imageRoot" .Values.sensorIngestion.metadataDB.frontend.image "global" .Values.global) }}
        ports:
          - containerPort: 8080
            name: http
        env:
          - name: SERVER_PORT
            value: "8080"
          - name: "SERVER_FALLBACK_PAGE"
            value: "/public/index.html"
          - name: SERVER_LOG_LEVEL
            value: "info"
          - name: SERVER_CONFIG_FILE
            value: "/config.toml"
        volumeMounts:
          - name: config
            mountPath: /public/config.js
            subPath: config.js
            readOnly: true
          - name: config
            mountPath: /config.toml
            subPath: config.toml
            readOnly: true
        resources: {{- toYaml .Values.sensorIngestion.metadataDB.frontend.resources | nindent 10 }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-%s" (include "common.names.fullname" .) $name | quote }}

---
{{- $serviceName := printf "%s-%s" (include "common.names.fullname" .) $name -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/part-of: metadata-db
spec:
  ports:
  - port: 80
    name: http
    targetPort: http
  selector: {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/part-of: metadata-db
---
{{- $host := include "sensor-ingestion.mdb.frontend.hostname" . -}}
{{ include "udh.gatewayapi.gateway" (dict "context" $ "name" $name "host" $host) }}
{{ include "udh.gatewayapi.https-redirect" (dict "context" $ "name" $name "host" $host) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  hostnames:
  - {{ $host }}
  parentRefs:
  - name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
    sectionName: https
  rules:
  - backendRefs:
    - name: {{ printf "%s-mdb" (include "common.names.fullname" .) }}
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /graphql
  - backendRefs:
    - name: {{ $serviceName }}
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
{{- if gt ( .Values.sensorIngestion.metadataDB.frontend.replicas | int64) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-pdb-%s" (include "common.names.fullname" .) $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
      app.kubernetes.io/part-of: metadata-db
{{- end }}
---
{{- $name := "landing-page" -}}
{{- $host := .Values.global.baseDomain -}}
{{ include "udh.gatewayapi.gateway" (dict "context" $ "name" $name "host" $host) }}
{{ include "udh.gatewayapi.https-redirect" (dict "context" $ "name" $name "host" $host) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  hostnames:
  - {{ $host }}
  parentRefs:
  - name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
    sectionName: https
  rules:
  - filters:
    - requestRedirect:
        hostname: {{ include "sensor-ingestion.mdb.frontend.hostname" . }}
        path:
          replaceFullPath: /
          type: ReplaceFullPath
        scheme: https
        statusCode: 301
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
