---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "data-hub.name" (dict "context" . "name" "grafana") }}
spec:
  releaseName: {{ include "data-hub.name" (dict "context" . "name" "grafana") }}
  chart:
    spec:
      chart: grafana
      version: 11.6.1 # renovate: datasource=docker depName=ghcr.io/grafana-community/helm-charts/grafana
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: {{ include "data-hub.name" (dict "context" . "name" "grafana") }}
  interval: 1h0m0s
  timeout: 15m
  targetNamespace: {{ .Release.Namespace }}
  values:
    replicas: {{ .Values.grafana.replicas }}
    {{- if gt (.Values.grafana.replicas | int64) 1 }}
    podDisruptionBudget:
      minAvailable: 1
    {{- end }}
    {{- with .Values.grafana.adminPassword }}
    adminPassword: {{ . }}
    {{- end }}
    headlessService: true
    image:
      registry: {{ .Values.grafana.image.registry | quote }}
      repository: {{ .Values.grafana.image.repository | quote }}
      {{- with .Values.grafana.image.digest }}
      sha: {{ regexReplaceAll "^sha256:" . "" | quote }}
      {{- else }}
      tag: {{ .Values.grafana.image.tag | default .Values.global.udhImageTag | quote }}
      {{- end }}
      pullPolicy: {{ .Values.grafana.image.pullPolicy | quote }}
      {{- include "udh-platform.imagePullSecrets" (dict "context" .) | replace "imagePullSecrets:" "pullSecrets:" | nindent 6 }}
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - {{ include "data-hub.grafana.hostname" . }}
      annotations: {{- include "udh.ingress.annotations" (dict "context" . "annotations" .Values.grafana.ingress.annotations) | nindent 8 }}
      tls:
        - hosts:
          - {{ include "data-hub.grafana.hostname" . }}
          secretName: {{ include "data-hub.grafana.hostname" . }}-tls
    resources: {{- $.Values.grafana.resources | toYaml | nindent 6 }}
    rbac:
      create: false
    plugins:
      {{- include "common.tplvalues.render" (dict "value" .Values.grafana.plugins "context" .) | nindent 6}}
    extraSecretMounts:
      - name: secret-files-postgres
        mountPath: /etc/secrets/postgres
        secretName: {{ include "data-hub.postgres.secret" (dict "context" . "name" "grafana-owner-user" ) }}
        readOnly: true
      - name: secret-files-smtp
        mountPath: /etc/secrets/smtp
        secretName: {{ include "data-hub.name" (dict "context" . "name" "grafana-smtp-secret") }}
        readOnly: true
      - name: secret-files-oauth
        mountPath: /etc/secrets/oauth
        secretName: {{ include "data-hub.name" (dict "context" . "name" "grafana-client-secret") }}
        readOnly: true
      {{- if $.Values.fakeCa.name }}
      - name: ca-cert
        mountPath: /etc/secrets/ca
        secretName: {{ .Values.fakeCa.name }}
        readOnly: true
      {{- end }}
    grafana.ini:
      auth:
        signout_redirect_url: {{ printf "https://%s//oauth2/sign_out?rd=%s" (include "data-hub.grafana.hostname" .) (urlquery (printf "https://%s/realms/udh/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https://%s/" (include "data-hub.keycloak.hostname" .) (include "sensor-ingestion.mdb.frontend.hostname" .) )) }}
      server:
        root_url: https://{{ include "data-hub.grafana.hostname" . }}/
      auth.generic_oauth:
        enabled: true
        auto_login: true
        name: keycloak-auth
        scopes: openid email
        login_attribute_path: sub
        email_attribute_path: email
        name_attribute_path: email
        org_attribute_path: orgs
        role_attribute_strict: true
        client_id: grafana
        client_secret: $__file{/etc/secrets/oauth/grafana-client-secret}
        auth_url: https://{{ include "data-hub.keycloak.hostname" . }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/auth
        token_url: https://{{ include "data-hub.keycloak.hostname" . }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/token
        api_url: https://{{ include "data-hub.keycloak.hostname" . }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/userinfo
        allow_sign_up: true
        use_pkce: true
        use_refresh_token: true
        {{- if $.Values.fakeCa.name }}
        tls_client_ca: /etc/secrets/ca/ca.crt
        {{- end }}
      database:
        type: postgres
        name: grafana
        ssl_mode: require
        user: $__file{/etc/secrets/postgres/username}
        password: $__file{/etc/secrets/postgres/password}
        host: {{ printf "%s:5432" (include "data-hub.postgres.hostRW" .) }}
      {{- if .Values.global.testDeployment }}
      log:
        level: debug
      {{- end }}
      smtp:
        enabled: {{ .Values.grafana.smtp.enabled }}
        from_address: {{ .Values.grafana.smtp.from_adress }}
        from_name: {{ .Values.grafana.smtp.from_name }}
        {{- if .Values.mailpit.enabled }}
        host: {{ (printf "%s-%s" (include "common.names.fullname" .) "mailpit-smtp") -}}:25
        {{- else }}
        host: {{ .Values.grafana.smtp.host }}
        {{- end }}
        user: {{ .Values.grafana.smtp.user }}
        password: $__file{/etc/secrets/smtp/password}
      unified_alerting:
        enabled: true
        ha_listen_address: ${POD_IP}:9094
        ha_peers: {{ include "data-hub.name" (dict "context" . "name" "grafana-headless") }}:9094
        ha_advertise_address: ${POD_IP}:9094
        ha_peer_timeout: 15s
        ha_reconnect_timeout: 2m
        state_history:
          annotations:
            max_age: 6M
      alerting:
        max_annotation_age: 6M
      annotations:
        cleanupjob_batchsize: 10000
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-hub.name" (dict "context" . "name" "grafana-smtp-secret") }}
  namespace: {{ .Release.Namespace }}
stringData:
  password: {{ .Values.grafana.smtp.password | quote}}
