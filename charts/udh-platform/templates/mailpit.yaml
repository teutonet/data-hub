{{- if .Values.mailpit.enabled -}}
{{- $name := "mailpit" -}}
{{- $host := include "data-hub.mailpit.hostname" . -}}
{{ include "udh.gatewayapi.gateway" (dict "context" $ "name" $name "host" $host) }}
{{ include "udh.gatewayapi.https-redirect" (dict "context" $ "name" $name "host" $host) }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ printf "%s-mailpit" (include "common.names.fullname" .) | quote }}
  namespace: {{ .Release.namespace }}
spec:
  interval: 5m0s
  url: https://jouve.github.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ (printf "%s-%s" (include "common.names.fullname" .) $name) | trunc 53 }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  chart:
    spec:
      chart: mailpit
      sourceRef:
        kind: HelmRepository
        name: {{ printf "%s-mailpit" (include "common.names.fullname" .) | quote}}
        namespace: {{ .Release.Namespace }}
      version: 0.36.0 # renovate: datasource=helm depName=mailpit versioning=helm registryUrl=https://jouve.github.io/charts/
  interval: 10m
  values:
    {{ with .Values.mailpit }}
    image: {{- .image | toYaml  | nindent 8 }}
    resources: {{- .resources | toYaml  | nindent 8 }}
    {{ if .livenessProbe }}
    livenessProbe: {{- .livenessProbe | toYaml | nindent 8 }}
    {{ end }}
    {{ if .readinessProbe }}
    readinessProbe: {{- .readinessProbe | toYaml | nindent 8 }}
    {{ end }}
    {{ end }}
    mailpit:
      ui:
        authFile:
          enabled: true
          htpasswd: |
            {{- range $user, $password := .Values.mailpit.auth.users }}
            {{ htpasswd $user $password }}
            {{- end }}
    route:
      http:
        enabled: true
        parentRefs:
        - name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
          sectionName: https
    persistence:
      enabled: true
      size: {{ (.Values.mailpit.volume).size | default "1Gi" }}
{{- end -}}