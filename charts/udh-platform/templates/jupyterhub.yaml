---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ include "data-hub.name" (dict "context" . "name" "jupyterhub") }}
spec:
  interval: 1h0m0s
  url: https://jupyterhub.github.io/helm-chart/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "data-hub.name" (dict "context" . "name" "jupyterhub") }}
spec:
  releaseName: {{ include "data-hub.name" (dict "context" . "name" "jupyterhub") }}
  chart:
    spec:
      chart: jupyterhub
      version: 4.4.0 # renovate: datasource=helm depName=jupyterhub versioning=helm registryUrl=https://jupyterhub.github.io/helm-chart/
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: {{ include "data-hub.name" (dict "context" . "name" "jupyterhub") }}
  interval: 1h0m0s
  targetNamespace: {{ .Release.Namespace }}
  values:
    fullnameOverride: null # default is empty string which removes all prefixes
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - {{ include "data-hub.jupyterhub.hostname" . }}
      annotations: {{- include "udh.ingress.annotations" (dict "context" $ "annotations" .Values.jupyterhub.ingress.annotations) | nindent 8 }}
      tls:
        - hosts:
          - {{ include "data-hub.jupyterhub.hostname" . }}
          secretName: {{ include "data-hub.jupyterhub.hostname" . }}-tls
    hub:
      networkPolicy:
        egress:
          - ports:
            - port: 6443
            - port: 8443
          - to:
            - podSelector:
                matchLabels:
                  cnpg.io/cluster: {{ printf "%s-cnpg" (include "common.names.fullname" .) }}
            ports:
              - protocol: TCP
                port: 5432
        {{- if $.Values.jupyterhub.singleuser.allowPrivateIPs }}
          - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: ingress-nginx
                  app.kubernetes.io/name: ingress-nginx
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: traefik
            ports:
              - protocol: TCP
                port: 80
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 8443
        {{- end }}
      config:
        GenericOAuthenticator:
          client_id: jupyterhub
          authorize_url: "https://{{ include "data-hub.keycloak.hostname" . }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/auth"
          token_url: "https://{{ include "data-hub.keycloak.hostname" . }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/token"
          userdata_url: "https://{{ include "data-hub.keycloak.hostname" . }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/userinfo"
          scope: [openid, email, profile]
          username_claim: sub # ensures that the user ALWAYS keeps their data (and only theirs!) across email address and username changes
          allow_all: true
          login_service: Data HUB
          oauth_callback_url: {{ printf "https://%s/hub/oauth_callback" (include "data-hub.jupyterhub.hostname" .) }}
          logout_redirect_url: {{ printf "https://%s/realms/udh/protocol/openid-connect/logout?client_id=jupyterhub" (include "data-hub.keycloak.hostname" .) }}
          validate_server_cert: {{ .Values.fakeCa.enabled | ternary "false" "true" }}
        Authenticator:
          auto_login: true
        JupyterHub:
          authenticator_class: generic-oauth
          tornado_settings:
            cookie_options:
              expires_days: 0.4167
        KubeSpawner:
          environment:
            BASE_DOMAIN: {{ .Values.global.baseDomain | quote }}
      db:
        type: postgres
        upgrade: true
      resources: {{- $.Values.jupyterhub.hub.resources | toYaml | nindent 8 }}
      extraVolumes:
        - name: db-credentials
          secret:
            secretName: {{ printf "%s-jupyterhub-postgres-credentials" (include "common.names.fullname"  .) }}
      extraVolumeMounts:
        - mountPath: /run/secrets/db
          name: db-credentials
      extraConfig:
        # see https://github.com/jupyterhub/zero-to-jupyterhub-k8s/issues/2545#issuecomment-2612703648
        db.py: |
          from pathlib import Path
          import sqlalchemy
          c.JupyterHub.db_url = sqlalchemy.engine.URL.create(
            drivername='postgresql+psycopg2',
            username=Path('/run/secrets/db/username').read_text(),
            password=Path('/run/secrets/db/password').read_text(),
            host={{ printf "%s-cnpg-rw" (include "common.names.fullname"  .) | quote }},
            port=5432,
            database='jupyterhub',
          ).render_as_string(hide_password=False)
    prePuller:
      resources: {{- $.Values.jupyterhub.prePuller.resources | toYaml | nindent 8 }}
    scheduling:
      userScheduler:
        enabled: false
    singleuser:
      image:
        {{ $image := include "udh-platform.images.image" (dict "imageRoot" .Values.jupyterhub.notebook.image "global" .Values.global) }}
        # not actually repository+tag but enough to make the jupyterhub chart put them back together correctly
        name: {{ regexReplaceAll ":[^:]*$" $image "" | quote }}
        tag: {{ regexReplaceAll "^.*:" $image "" | quote }}
        pullPolicy: {{ .Values.jupyterhub.notebook.image.pullPolicy | quote }}
        {{- include "udh-platform.imagePullSecrets" (dict "context" .) | replace "imagePullSecrets:" "pullSecrets:" | nindent 8 }}
      cpu:
        limit: 0.5
        guarantee: 0.25
      memory:
        limit: 1G
        guarantee: 512M
      storage:
        capacity: {{ .Values.jupyterhub.singleuser.storageCapacity }}
        dynamic:
          subPath: data
      {{- if $.Values.fakeCa.name }}
        extraVolumes:
          - name: ca-cert
            secret:
              secretName: {{ .Values.fakeCa.name }}
              items:
              - key: ca.crt
                path: ca.crt
        extraVolumeMounts:
          - mountPath: /tls
            name: ca-cert
      lifecycleHooks:
        postStart:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                cat /tls/ca.crt >> $(python -c 'import certifi; print(certifi.where())')
      {{- end }}
      {{- if $.Values.jupyterhub.singleuser.allowPrivateIPs }}
      networkPolicy:
        egressAllowRules:
          privateIPs: true
        egress:
          - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: ingress-nginx
                  app.kubernetes.io/name: ingress-nginx
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: traefik
            ports:
              - protocol: TCP
                port: 80
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 8443
      {{- end }}
    proxy:
      service:
        type: ClusterIP
      chp:
        resources: {{- $.Values.jupyterhub.proxy.chp.resources | toYaml | nindent 10 }}
      traefik:
        resources: {{- $.Values.jupyterhub.proxy.traefik.resources | toYaml | nindent 10 }}
      secretSync:
        resources: {{- $.Values.jupyterhub.proxy.secretSync.resources | toYaml | nindent 10 }}
    cull:
      maxAge: 36000
