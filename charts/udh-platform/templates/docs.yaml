{{- if .Values.doc.enabled -}}
{{ $name := "docs" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ .Values.doc.replicas | default 1 | int }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- include "udh-platform.imagePullSecrets" (dict "context" .) | nindent 6 }}
      containers:
      - name: {{ $name }}
        image: {{ include "udh-platform.images.image" (dict "imageRoot" .Values.doc.image "global" .Values.global) }}
        imagePullPolicy: {{ .Values.doc.image.pullPolicy }}
        ports:
          - containerPort: 3000
            name: http
        resources: {{- toYaml .Values.doc.resources | nindent 10 }}
---
{{ $serviceName := printf "%s-%s" (include "common.names.fullname" .) $name -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  ports:
  - port: 80
    name: http
    targetPort: http
  selector: {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{ $host := include "data-hub.docs.hostname" . -}}
{{ include "udh.gatewayapi.gateway" (dict "context" $ "name" $name "host" $host) }}
{{ include "udh.gatewayapi.https-redirect" (dict "context" $ "name" $name "host" $host) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  hostnames:
  - {{ $host }}
  parentRefs:
  - name: {{ printf "%s-%s" (include "common.names.fullname" .) $name }}
    sectionName: https
  rules:
  - backendRefs:
    - name: {{ $serviceName }}
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
{{- end -}}