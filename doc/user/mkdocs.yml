site_name: Teuto Data Hub Dokumentation
markdown_extensions:
  - admonition
  - abbr

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
theme:
  name: material
  language: de
plugins:
  - search
  - print-site
watch: []
